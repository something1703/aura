[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aura"
version = "0.1.0"
description = "AURA — Autonomous Unified Reliability Architecture: architecture decision, validation, and reliability-analysis platform for AWS workloads."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
aws = [
    "boto3>=1.34",
]

[project.scripts]
aura = "aura.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aura = ["reporting/templates/*.j2", "reporting/templates/terraform/*.j2", "web/examples/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "aws: tests that call live AWS APIs (never run by default)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 (function call in default argument) is the required Typer/FastAPI
# idiom (`= typer.Option(...)`, `= Depends(...)`) — not a bug here.
ignore = ["B008"]
