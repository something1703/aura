services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      AURA_WEB_ORIGIN: http://localhost:3000

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      # Read at request time by src/app/api/[...path]/route.ts. "api" is the
      # other service's name on the compose network, not localhost.
      AURA_API_URL: http://api:8000
    depends_on:
      - api
