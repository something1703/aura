services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      AURA_WEB_ORIGIN: http://localhost:3000

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_AURA_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
